[package]
name = "cntr"
edition = "2024"
rust-version = "1.85"
description = "A container debugging tool based on Linux mount API"
version = "2.0.0"
authors = ["Jörg Thalheim <joerg@thalheim.io>"]
categories = ["development-tools::debugging", "os::unix-apis"]
repository = "https://github.com/Mic92/cntr"
license = "MIT"

[dependencies]
log = "0.4.30"
container-pid = "2.0"
thiserror = "2"
rustix = { version = "1.1.4", features = [
  "event",
  "fs",
  "mount",
  "net",
  "pipe",
  "process",
  "pty",
  "runtime",
  "stdio",
  "termios",
  "thread",
] }
rustix-dlmalloc = { version = "0.2.2", features = ["global"] }
syscalls = { version = "0.8.1", default-features = false, features = ["std"] }
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["general", "no_std"] }

[[bin]]
name = "cntr"
path = "src/bin/main.rs"
