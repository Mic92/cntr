name: CI
on:
  pull_request:
  merge_group:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # The binary links no libc, so one target per architecture is enough.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            rust: stable
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            rust: stable
          # Cross-compiled targets
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
            rust: stable
            cross: true
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            rust: stable
            cross: true
          # Falls back to a std/libc start since origin has no arm start code.
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            rust: stable
            cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Ready cache
        run: sudo chown -R "$(whoami):$(id -ng)" ~/.cargo/
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross
      - name: Test (native)
        if: ${{ !matrix.cross }}
        run: cargo test --target ${{ matrix.target }}
      - name: Test (cross)
        if: matrix.cross
        run: cross test --target ${{ matrix.target }}
